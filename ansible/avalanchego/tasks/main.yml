---
- name: Install AvalancheGo
  hosts: validators:rpc
  become: true
  vars:
    avalanchego_version: "1.13.5"
    avalanchego_user: avalanche
    data_dir: /var/lib/avalanchego
  tasks:
    - name: Create service user
      user:
        name: "{{ avalanchego_user }}"
        system: true
        shell: /usr/sbin/nologin
        home: "{{ data_dir }}"

    - name: Create directories
      file:
        path: "{{ item }}"
        state: directory
        owner: "{{ avalanchego_user }}"
        group: "{{ avalanchego_user }}"
        mode: "0750"
      loop:
        - "{{ data_dir }}"
        - /etc/avalanchego
        - /etc/avalanchego/staking

    - name: Download AvalancheGo release
      get_url:
        url: "https://github.com/ava-labs/avalanchego/releases/download/v{{ avalanchego_version }}/avalanchego-linux-amd64-v{{ avalanchego_version }}.tar.gz"
        dest: /tmp/avalanchego.tar.gz
        mode: "0644"
        # Gap: no checksum. Do not treat this role as supply-chain safe.

    - name: Extract AvalancheGo
      unarchive:
        src: /tmp/avalanchego.tar.gz
        dest: /usr/local/bin
        remote_src: true
        extra_opts: ["--strip-components=1"]

    - name: Install node config
      template:
        src: config.json.j2
        dest: /etc/avalanchego/config.json
        owner: "{{ avalanchego_user }}"
        mode: "0640"

    - name: Install systemd unit
      copy:
        dest: /etc/systemd/system/avalanchego.service
        mode: "0644"
        content: |
          [Unit]
          Description=AvalancheGo
          After=network-online.target
          Wants=network-online.target
          [Service]
          User={{ avalanchego_user }}
          ExecStart=/usr/local/bin/avalanchego --config-file=/etc/avalanchego/config.json
          Restart=on-failure
          LimitNOFILE=32768
          [Install]
          WantedBy=multi-user.target

    - name: Enable AvalancheGo
      systemd:
        name: avalanchego
        enabled: true
        state: started
        daemon_reload: true
